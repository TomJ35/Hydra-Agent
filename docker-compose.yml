services:
  agent-manager:
    image: python:3.11-slim
    container_name: hydra-agent-manager
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      AGENT_ROLE: manager
      PYTHONUNBUFFERED: 1
    command: ["sh", "-c", "pip install --no-cache-dir websockets && python -u src/agent_manager/manager.py"]
    restart: unless-stopped

  creation-agent:
    image: python:3.11-slim
    container_name: hydra-creation-agent
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      AGENT_ROLE: creation
    command: ["sh", "-c", "echo 'creation-agent service ready (placeholder)'; sleep infinity"]
    restart: unless-stopped
